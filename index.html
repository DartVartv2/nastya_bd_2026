<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="#fff7e8" name="theme-color"/>
<meta content="Для тебя кое-что пушистое! 🐸" name="description"/>
<title>Тебя ждёт кое-что пушистое! 🐸</title>
<style>
    :root {
      --paper: #fff8e9; --ink: #29211f; --muted:#76675e; --pink:#ff77b8; --hot:#f84ba6;
      --lilac:#a783f8; --purple:#6e49df; --lime:#b9f46b; --green:#8dcf32;
      --orange:#ff9a5a; --yellow:#ffdc61; --blue:#92cdfa; --line:#322720;
      --rounded: "Arial Rounded MT Bold", "Trebuchet MS", Verdana, sans-serif;
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:var(--rounded); overflow-x:hidden; }
    button,a { -webkit-tap-highlight-color:transparent; }
    button { font:inherit; cursor:pointer; }
    a { color:inherit; }
    button:focus-visible, a:focus-visible { outline:4px solid var(--purple); outline-offset:5px; }
    ::selection { background:var(--pink); color:var(--ink); }
    .stage { isolation:isolate; position:relative; overflow:hidden; min-height: min(900px, 100svh); padding: 28px max(24px, calc((100vw - 1210px)/2)) 100px; background: radial-gradient(circle at 49% 0%,#fffef8 0,#fff8e9 59%,#fdf0df 100%); }
    .stage::before { content:""; position:absolute; width:900px; height:900px; right:-360px; top:-410px; background:#ffe1ed; border-radius:50%; z-index:-2; }
    .stage::after { content:""; position:absolute; width:560px; height:500px; left:-390px; bottom:-250px; background:#def4b4; border-radius:50%; z-index:-2; }
    .speckle { pointer-events:none; position:absolute; inset:0; opacity:.52; z-index:-1; background-image: radial-gradient(#edbaab 1.25px,transparent 1.25px); background-size:33px 33px; mask-image: linear-gradient(90deg, transparent, black 10%,transparent 60%); }
    .topbar { position:relative; z-index:9; display:flex; align-items:center; justify-content:space-between; gap:18px; max-width:1210px; margin:0 auto; }
    .brand { display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--ink); }
    .brand-icon { width:44px; height:44px; transform:rotate(-9deg); border:2px solid var(--line); border-radius:15px; background:var(--yellow); display:grid; place-items:center; box-shadow:4px 4px 0 var(--line); }
    .brand-icon svg { width:33px; }
    .brand-title { font-size:23px; font-weight:1000; letter-spacing:-1.6px; text-transform:uppercase; white-space:nowrap; }
    .brand-title span:nth-child(1) {color:#8dc956}.brand-title span:nth-child(2) {color:#fb9653}.brand-title span:nth-child(3) {color:#fc66b0}.brand-title span:nth-child(4) {color:#9061e7}.brand-title span:nth-child(5) {color:#48b9e5}.brand-title span:nth-child(6) {color:#f1bc24}
    .top-note { display:flex; align-items:center; gap:9px; font-size:13px; font-weight:900; letter-spacing:.02em; border:2px dashed #f5a1c8; background:#fff8f5; border-radius:100px; padding:11px 16px; transform:rotate(2deg); }
    .top-note i { font-style:normal; color:var(--hot); font-size:18px; }
    .hero { position:relative; display:grid; grid-template-columns:1.08fr 1fr; align-items:center; gap:5px; max-width:1210px; margin: 70px auto 0; }
    .hero-copy { z-index:3; padding:0 0 65px; }
    .eyebrow { display:inline-flex; align-items:center; gap:12px; padding:11px 16px; margin-bottom:26px; border:2px solid var(--line); border-radius:30px; background:#d6f5ad; box-shadow:4px 4px 0 var(--line); transform:rotate(-2.2deg); font-size:13px; font-weight:1000; text-transform:uppercase; letter-spacing:.065em; }
    .eyebrow .mini-star { font-size:19px; color:#ea6e48; line-height:0; }
    h1 { margin:0; font-size:clamp(53px,6.2vw,89px); letter-spacing:-.072em; line-height:1.035; font-weight:1000; max-width:730px; }
    h1 .highlight { display:inline-block; z-index:0; position:relative; white-space:nowrap; color:#e94e9e; transform:rotate(-2deg); }
    h1 .highlight::after { content:""; position:absolute; background:#ffe16c; border-radius:50%; height:16px; bottom:5px; right:-2%; left:0; z-index:-1; transform:rotate(1deg); }
    .hero-desc { max-width:545px; font-size:20px; line-height:1.55; color:#615248; font-weight:600; margin:28px 0 31px; }
    .hero-desc strong { color:var(--ink); }
    .primary-btn { display:inline-flex; justify-content:center; align-items:center; gap:13px; text-align:center; border:3px solid var(--line); border-radius:19px; color:#fff; background:#7753e8; padding:19px 27px; font-size:17px; font-weight:1000; box-shadow:7px 8px 0 var(--line); transition:transform .15s, box-shadow .15s, background .2s; }
    .primary-btn:hover { transform:translate(3px,3px) rotate(-1deg); box-shadow:4px 5px 0 var(--line); background:#6541d9; }
    .primary-btn:active {transform:translate(7px,8px);box-shadow:0 0 0 var(--line)}
    .primary-btn .arrow { display:inline-block; font-size:24px; line-height:1; }
    .little-instruction { font-size:13px; color:#968575; margin:22px 0 0 10px; font-weight:700; }
    .scene { position:relative; min-width:0; height:550px; display:grid; place-items:center; }
    .scene::before { content:""; position:absolute; border-radius:44% 56% 47% 53%; width:96%; height:91%; top:6%; left:1%; background:#d3c0ff; border:3px solid #6b55ad; transform:rotate(11deg); box-shadow:18px 20px 0 #eadfff; }
    .scene::after { content:""; position:absolute; border-radius:50%; width:70%; height:10%; bottom:3%; left:20%; background:#9a78cb; opacity:.21; filter:blur(17px); }
    .frog-btn { position:relative; z-index:2; padding:0; background:none; border:0; width:100%; max-width:560px; transform:rotate(-1.5deg); transition:transform .28s ease; cursor:pointer; }
    .frog-btn:hover { transform:rotate(1deg) scale(1.035) translateY(-5px); }
    .frog-art { display:block; width:100%; height:auto; filter:drop-shadow(0 15px 0 rgba(76,46,92,.10)); animation:frogFloat 3.6s ease-in-out infinite; overflow:visible; }
    .froggy-eyes { transform-origin:center; animation:blink 8s infinite; }
    .frog-btn.boing .frog-art { animation:boing .5s both; }
    .scene-sticker { position:absolute; z-index:4; top:7px; right:-5px; background:#fff9b7; border:2px solid var(--line); border-radius:50%; transform:rotate(13deg); width:113px; aspect-ratio:1; display:grid;place-items:center; text-align:center; font-size:14px; font-weight:1000; line-height:1.35; box-shadow:6px 6px 0 var(--line); }
    .scene-sticker .heart { font-size:22px;color:var(--hot); }
    .scene-tag { position:absolute; z-index:3; bottom:14px; left:-20px; background:#fc88bc; padding:11px 20px; border:2px solid var(--line); border-radius:12px; transform:rotate(-8deg); font-size:15px; font-weight:1000; box-shadow:5px 5px 0 var(--line); }
    .scribble { position:absolute; font-size:38px; font-weight:900; pointer-events:none; animation:twinkle 3s ease-in-out infinite; }
    .s1 { left:6%; top:9%; color:#eb6b95; }.s2 {right:3%; bottom:24%;color:#ffdf62;animation-delay:1.2s}.s3 {top:25%;right:1%; color:#fff;font-size:55px;animation-delay:.7s}
    .balloon-field { position:absolute; inset:0; pointer-events:none; z-index:5; }
    .balloon { pointer-events:auto; position:absolute; width:68px; height:100px; border:0; background:none; padding:0; animation:drift var(--dur,4s) ease-in-out infinite alternate; transform-origin:bottom center; }
    .balloon-body { position:absolute; inset:2px 2px 17px; background:var(--c); border:2.5px solid #352a28; border-radius:49% 51% 50% 50% / 53% 54% 46% 47%; box-shadow:inset -11px -7px 0 rgba(31,23,40,.08); transition:scale .12s; }
    .balloon-body::before {content:"";position:absolute;width:11px;height:29px;border-radius:50%;background:#fff9;left:13px;top:13px;transform:rotate(25deg)}
    .balloon-body::after { content:""; position:absolute;left:calc(50% - 6px);bottom:-10px;width:12px;height:10px;background:var(--c);border:2px solid #352a28;border-radius:40% 40% 58% 58%;transform:rotate(-5deg);box-shadow:none; }
    .balloon-string { position:absolute; top:92px; left:34px; height:78px; width:24px; border-left:2px solid #493f38; border-radius:0 0 0 70%; transform:rotate(-5deg); }
    .balloon:hover .balloon-body {scale:1.08}
    .balloon.pop {animation:none!important;pointer-events:none}.balloon.pop .balloon-body {animation:balloonPop .23s ease-out forwards}.balloon.pop .balloon-string {opacity:0;transition:opacity .1s}
    .balloon.one {left:2.2%;top:18%;--c:#ff87c0;--dur:4.2s;transform:rotate(-14deg)}
    .balloon.two {left:1%;top:62%;--c:#b9f46b;--dur:3.7s;animation-delay:-1.5s}
    .balloon.three {right:3%;top:21%;--c:#ffe06d;--dur:5s;animation-delay:-2s}
    .balloon.four {right:8%;top:42%;--c:#a98cf5;--dur:4.1s;animation-delay:-1s}
    .balloon.five {left:45%;bottom:3%;--c:#83d8fa;--dur:4.8s;animation-delay:-3s}
    .balloon.six {right:24%;bottom:2%;--c:#ff9c71;--dur:3.9s;animation-delay:-2.4s}
    .balloon-count {position:absolute;z-index:7;bottom:16px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:900;color:#8f776f;background:#fff9efdb;border:2px solid #e6cdbb;padding:9px 16px;border-radius:99px;text-align:center;white-space:nowrap;}
    .pop-message {position:fixed;top:90px;left:50%;transform:translate(-50%,-25px);z-index:150;opacity:0;pointer-events:none; padding:14px 22px;border-radius:24px; background:#e0f8b5;border:3px solid var(--line);box-shadow:5px 6px 0 var(--line);font-weight:900;transition:opacity .2s,transform .25s;max-width:92vw;text-align:center;}
    .pop-message.show {opacity:1;transform:translate(-50%,0)}
    .content { position:relative; padding:100px 24px 110px; background:linear-gradient(180deg,#fff4f0,#fff8e9 42%,#fff8e9); }
    .content::before { content:""; position:absolute; top:-38px;left:0;right:0;height:52px;background: radial-gradient(circle at 23px -9px,transparent 30px,#fff4f0 31px) 0 0/47px 53px repeat-x; }
    .section-header {max-width:1000px;margin:0 auto 34px;text-align:center}
    .section-kicker {display:inline-block;padding:9px 18px;background:var(--yellow);border:2px solid var(--line);box-shadow:4px 4px 0 var(--line);border-radius:100px;transform:rotate(-3deg);text-transform:uppercase;font-size:12px;letter-spacing:.12em;font-weight:1000}
    h2 {font-size:clamp(39px,6vw,67px);letter-spacing:-.065em;line-height:1.08;margin:22px 0 15px;font-weight:1000}
    .section-header p {font-size:18px;color:#7d6960;font-weight:700;line-height:1.5}
    .certificate-wrap {max-width:1120px;margin:auto;perspective:1600px}
    .ticket {position:relative;display:grid;grid-template-columns:.9fr 1.1fr;background:#fffdf6;border:3px solid var(--line);border-radius:32px;box-shadow:15px 18px 0 #f7bcd6, 18px 21px 0 var(--line);overflow:hidden;min-height:485px;transform-origin:50% 0;}
    .ticket-art {position:relative;background:#bdec85;display:flex;align-items:center;justify-content:center;min-height:425px;overflow:hidden;border-right:3px dashed #4c6040}
    .ticket-art::before {content:"";position:absolute;width:430px;height:430px;background:#efb2e3;border:3px solid #382935;border-radius:42% 58% 48% 52%;transform:rotate(19deg) translate(-3%,5%);}
    .ticket-art::after {content:"";position:absolute;width:150px;height:150px;border:17px solid #f2d76a; border-radius:50%;top:-75px;right:-60px;}
    .ticket-rug {position:relative;width:87%;max-width:390px;transform:rotate(-9deg);filter:drop-shadow(11px 15px 0 #332428);}
    .ticket-rug svg {display:block;width:100%;height:auto}
    .ticket-mini-label {position:absolute;bottom:30px;right:17px;transform:rotate(7deg);background:white;border:2px solid var(--line);border-radius:12px;box-shadow:4px 4px 0 var(--line);padding:10px 14px;font-weight:1000;font-size:13px;}
    .ticket-info {padding:49px 48px 38px;position:relative;background-image:radial-gradient(#e8cde6 1.1px,transparent 1.1px);background-size:18px 18px}
    .ticket-info::before,.ticket-info::after{content:"";position:absolute;left:-19px;width:35px;height:35px;border-radius:50%;border:3px solid var(--line);background:#fff4f0;z-index:2}
    .ticket-info::before{top:-19px}.ticket-info::after{bottom:-19px}
    .ticket-stamp {display:inline-flex;gap:8px;align-items:center;background:#f9d0e7;border:2px solid var(--line);border-radius:99px;padding:8px 13px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:1000;}
    .ticket h3 {font-size:clamp(37px,4vw,60px);line-height:1.06;letter-spacing:-.067em;margin:22px 0 14px;font-weight:1000}
    .ticket h3 .pink {color:#ed4a97}
    .ticket-subtitle {font-size:16px;line-height:1.5;color:#6d5b53;font-weight:700;margin:0 0 24px;max-width:400px}
    .meta {display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:0 0 20px}
    .meta-item {background:#fff4d9;border:2px solid var(--line);border-radius:14px;padding:13px 15px}
    .meta-item:nth-child(2) {background:#e8dfff}
    .meta-item .small {color:#71645a;font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:1000;margin-bottom:5px}
    .meta-item .value {font-weight:1000;font-size:20px;letter-spacing:-.03em}
    .serial-box {background:#f6f1e8;border:2px dashed #8e8170;border-radius:13px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
    .serial-box .small{font-size:11px;text-transform:uppercase;color:#85796e;letter-spacing:.06em;font-weight:1000}
    .serial {font-weight:1000;font-size:clamp(16px,2vw,21px);letter-spacing:.025em;margin-top:4px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
    .copy-btn {flex-shrink:0;border:2px solid var(--line);border-radius:11px;background:#fff;padding:10px 12px;font-size:12px;font-weight:900;box-shadow:3px 3px 0 var(--line);transition:transform .15s,box-shadow .15s}
    .copy-btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}
    .ticket-note {font-size:12px;color:#88786e;margin:17px 0 0;font-weight:700}
    .gift-signature {padding:45px 12px 18px;text-align:center;color:#6f6055;font-size:19px;font-weight:800;line-height:1.6}
    .gift-signature strong {color:#ec5ba1}
    .action-strip {display:flex;justify-content:center;flex-wrap:wrap;gap:15px;margin:15px auto 0}
    .pill-link {text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:51px;padding:13px 20px;font-size:14px;font-weight:1000;border:2px solid var(--line);border-radius:14px;background:#bff28b;box-shadow:4px 5px 0 var(--line);transition:transform .15s,box-shadow .15s}
    .pill-link.second {background:#ffddeb}.pill-link:hover{transform:translate(2px,3px);box-shadow:2px 2px 0 var(--line)}
    .mini-activity {max-width:1050px;margin:105px auto 0;display:grid;grid-template-columns:.9fr 1fr;gap:65px;align-items:center}
    .activity-copy .section-kicker {background:#d3c3ff}
    .activity-copy h2 {margin-top:28px}
    .activity-copy p {color:#75655e;font-weight:700;line-height:1.6;font-size:17px;max-width:440px}
    .tip {margin-top:18px;display:flex;align-items:flex-start;gap:11px;font-size:13px;line-height:1.5;color:#90796f;font-weight:700}
    .tip .emoji {font-size:20px}
    .paint-card {background:#fffdf7;border:3px solid var(--line);border-radius:28px;padding:22px;box-shadow:11px 12px 0 #d9c8ff,14px 15px 0 var(--line);transform:rotate(1deg)}
    .paint-title {display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;gap:10px;font-weight:1000;font-size:16px}
    .paint-title .stars {color:var(--purple);font-size:25px}
    .rug-frame {background:#c9966c;border:8px solid #eab887;outline:2px solid var(--line);border-radius:7px;padding:12px;box-shadow:inset 0 0 0 2px #fff5e4;position:relative}
    .rug-frame:before,.rug-frame:after {content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#fff8c9;border:2px solid var(--line);top:1px}.rug-frame:before{left:1px}.rug-frame:after{right:1px}
    .pixel-rug {margin:auto;display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px;aspect-ratio:1;max-width:380px;touch-action:none;user-select:none;}
    .px {border-radius:3px;background:var(--px,#fff6dd);box-shadow:inset 1px 1px 1px #fff9, inset -1px -1px 1px #0001;cursor:crosshair;transition:background-color .08s;}
    .px:hover {outline:1px solid #433628;outline-offset:-1px}
    .palette-row {display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap;margin-top:20px}
    .palette {display:flex;gap:9px}
    .swatch {width:34px;height:34px;border:2px solid var(--line);border-radius:50%;background:var(--swatch);padding:0;box-shadow:2px 3px 0 #0002;transition:transform .15s}
    .swatch.active {outline:3px solid #6a4be4;outline-offset:3px;transform:translateY(-3px)}
    .paint-tools {display:flex;gap:8px}
    .tool-btn {background:#f8e9fc;border:2px solid var(--line);padding:9px 11px;border-radius:9px;font-size:12px;font-weight:900}
    .tool-btn:hover{background:#efd4ff}
    .end {position:relative;text-align:center;background:#2b2440;color:#fff7ee;padding:50px 24px 43px;overflow:hidden}
    .end::before,.end::after{content:"✳";position:absolute;font-size:150px;color:#ad90ed;opacity:.15;top:-70px;left:4%}.end::after{left:auto;right:4%;top:auto;bottom:-85px;color:#fff06f}
    .end .large {font-size:36px;font-weight:1000;letter-spacing:-.05em}
    .end p {color:#d7cfe2;line-height:1.5;font-size:14px;max-width:620px;margin:10px auto 0}
    .end a{color:#c6f19c;text-decoration-thickness:2px;text-underline-offset:3px}
    .hidden {display:none!important}
    .content.is-revealed .ticket {animation:ticketAppear .85s cubic-bezier(.17,.67,.23,1.09) both}
    .confetti {position:fixed;width:10px;height:14px;top:0;left:0;pointer-events:none;z-index:999;transform:translate(-50%,-50%);animation:confettiFly var(--t,900ms) cubic-bezier(.08,.62,.3,1) forwards;}
    .heart-particle {position:fixed;z-index:200;pointer-events:none;font-size:23px;animation:heartRise .9s ease-out forwards;}
    @keyframes frogFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
    @keyframes blink{0%,43%,45%,100%{transform:scaleY(1)}44%{transform:scaleY(.07)}}
    @keyframes twinkle{0%,100%{scale:1;rotate:0deg}50%{scale:1.15;rotate:12deg}}
    @keyframes drift{0%{translate:0 0;rotate:-5deg}100%{translate:5px -19px;rotate:6deg}}
    @keyframes balloonPop{0%{transform:scale(1);opacity:1}50%{transform:scale(1.24);opacity:.9}100%{transform:scale(.1);opacity:0}}
    @keyframes boing{0%{transform:translateY(0) rotate(0)}40%{transform:translateY(-21px) rotate(6deg)}75%{transform:translateY(3px) rotate(-4deg)}100%{transform:translateY(0) rotate(0)}}
    @keyframes ticketAppear{from{opacity:0;transform:translateY(45px) rotateX(-12deg) scale(.96)}to{opacity:1;transform:translateY(0) rotateX(0) scale(1)}}
    @keyframes confettiFly{from{opacity:1;transform:translate(-50%,-50%) rotate(0)}to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--spin))}}
    @keyframes heartRise{from{opacity:1;transform:translate(-50%,-50%) scale(.4)}to{opacity:0;transform:translate(calc(-50% + var(--hx)),-145px) scale(1.7) rotate(var(--hr))}}
    @media(max-width:1050px){.stage{padding-bottom:96px}.hero{grid-template-columns:1fr .95fr;gap:2px}.hero h1{font-size:clamp(50px,6.5vw,77px)}.hero-desc{font-size:17px}.scene{height:470px}.scene-sticker{right:0}.balloon.one,.balloon.two{left:0}.balloon.four{right:0}.ticket-info{padding:37px 26px}.ticket h3{font-size:47px}.mini-activity{gap:30px}}
    @media(max-width:720px){
      .stage{min-height:auto;padding:18px 20px 78px}.topbar{gap:9px}.brand-title{font-size:20px}.brand-icon{width:38px;height:38px}.top-note{font-size:11px;padding:8px 10px;max-width:142px;line-height:1.25}
      .hero{margin-top:60px;grid-template-columns:1fr;gap:8px}.hero-copy{padding:0;text-align:center}.eyebrow{font-size:10px;margin-bottom:20px}.hero h1{margin:auto;max-width:590px;font-size:clamp(48px,12vw,72px)}.hero-desc{font-size:17px;max-width:520px;margin:22px auto 24px}.primary-btn{font-size:16px;padding:18px 22px}.little-instruction{font-size:12px;margin:17px 0 0}

      let revealed = false, popped = 0, toastTimeout;
      const gift = $('gift');
      const balloons = [...document.querySelectorAll('.balloon')];
      function toast(message) {
        const el = $('toast'); el.textContent = message; el.classList.add('show');
        clearTimeout(toastTimeout); toastTimeout = setTimeout(() => el.classList.remove('show'), 2600);
      }
      function burst(x,y,amount=32) {
        if (reducedMotion) return;
        for(let i=0;i<amount;i++) {
          const bit=document.createElement('i'); bit.className='confetti';
          bit.style.background=colors[Math.floor(Math.random()*5)]; bit.style.borderRadius=Math.random()>.58?'50%':'2px';
          bit.style.left=x+'px';bit.style.top=y+'px';
          const a=(Math.PI*2*i/amount)+(Math.random()-.5)*.7;
          const r=65+Math.random()*195;
          bit.style.setProperty('--dx',Math.cos(a)*r+'px');
          bit.style.setProperty('--dy',(Math.sin(a)*r+80)+'px');
          bit.style.setProperty('--spin',(Math.random()*1100-550)+'deg');
          bit.style.setProperty('--t',(680+Math.random()*650)+'ms');
          document.body.appendChild(bit);
          bit.addEventListener('animationend',()=>bit.remove(),{once:true});
        }
      }

      function bigBalloonBurst(x,y,mainColor) {
        if (reducedMotion) return;
        const blast=document.createElement('div');blast.className='pop-burst';
        blast.style.left=x+'px';blast.style.top=y+'px';
        blast.style.setProperty('--pop-color',mainColor);
        blast.innerHTML='<span class="pop-ring"></span><span class="pop-flash"></span>';
        const popColors=[mainColor,'#fff3af','#ff76ad','#c8afff','#9fe8f6','#ffffff'];
        const count=32;
        for(let i=0;i<count;i++) {
          const frag=document.createElement('i');frag.className=i%4===0?'pop-spark':'pop-shard';
          const theta=Math.PI*2*i/count+(Math.random()-.5)*.19;
          const radius=118+Math.random()*178;
          frag.style.setProperty('--piece',popColors[Math.floor(Math.random()*popColors.length)]);
          frag.style.setProperty('--dx',(Math.cos(theta)*radius)+'px');
          frag.style.setProperty('--dy',(Math.sin(theta)*radius+28)+'px');
          frag.style.setProperty('--spin',(Math.random()*1200-600)+'deg');
          frag.style.setProperty('--speed',(550+Math.random()*550)+'ms');
          frag.style.setProperty('--w',(8+Math.random()*12)+'px');
          frag.style.setProperty('--h',(12+Math.random()*15)+'px');
          blast.appendChild(frag);
        }
        document.body.appendChild(blast);
        setTimeout(()=>blast.remove(),1200);
        burst(x,y,30);
      }
      function reveal() {
        if (popped !== balloons.length) return;
        $('toast').classList.remove('show');
        if (!revealed) {
          revealed=true;gift.classList.remove('hidden');gift.classList.add('is-revealed');
          $('revealButton').innerHTML='Смотреть сертификат <span class="arrow">↓</span>';
          const r=$('revealButton').getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,66);
        }
        setTimeout(() => gift.scrollIntoView({behavior:reducedMotion?'instant':'smooth',block:'start'}), 200);
      }
      $('revealButton').addEventListener('click', reveal);
      const frog=$('frogButton');
      frog.addEventListener('click', () => {
        frog.classList.remove('boing'); void frog.offsetWidth; frog.classList.add('boing');
        const r=frog.getBoundingClientRect();
        if (!reducedMotion) for(let i=0;i<7;i++) {
          const h=document.createElement('span');h.className='heart-particle';h.textContent=i%2?'♥':'✦';h.style.color=colors[i%5];
          h.style.left=r.left+r.width*(.3+Math.random()*.4)+'px';h.style.top=r.top+r.height*.57+'px';
          h.style.setProperty('--hx',(Math.random()-.5)*240+'px');h.style.setProperty('--hr',(Math.random()*100-50)+'deg');
          document.body.appendChild(h);h.addEventListener('animationend',()=>h.remove(),{once:true});
        }

      });
      balloons.forEach((balloon) => balloon.addEventListener('click', () => {
        if(balloon.classList.contains('pop')) return;
        const rect=balloon.getBoundingClientRect(); balloon.classList.add('pop');popped++;
        bigBalloonBurst(rect.left+rect.width/2,rect.top+rect.height*.36,balloon.dataset.burstColor||'#F6A3C7');
        $('balloonCount').textContent=`🎈 Лопни все шарики · ${popped} из ${balloons.length}`;
        if(popped===balloons.length) {
          $('balloonCount').textContent='✦ 6 из 6';
          const cta=$('revealButton'); cta.hidden=false; cta.classList.add('ready');
          toast('Лопнули все шарики!');
          const r=cta.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2,38);
        }
      }));
      $('copyButton').addEventListener('click', async () => {
        const value=$('serial').textContent.trim();
        try {
          if(navigator.clipboard?.writeText && window.isSecureContext) await navigator.clipboard.writeText(value);
          else {
            const input=document.createElement('textarea');input.value=value;input.style.position='fixed';input.style.opacity='0';document.body.appendChild(input);input.select();
            const success=document.execCommand('copy');input.remove(); if(!success) throw new Error('copy failed');
          }
          toast('Телефон скопирован! ♥');$('copyButton').textContent='Готово ✓';setTimeout(()=>{$('copyButton').textContent='Скопировать ⧉'},2200);
        } catch(e) {toast('Телефон: '+value)}
      });

      // 13×13 interactive tufted pixel-rug: entirely client-side and offline.
      const size=13, grid=$('pixelRug'),palette=$('palette');
      const pixels=[], cells=[];
      const initialHeart = [
        '.............','...PP...PP...','..PPPP.PPPP..','.PPPPPPPPPPP.','.PPPPPPPPPPP.','.PPPPPPPPPPP.',
        '..PPPPPPPPP..','...PPPPPPP...','....PPPPP....','.....PPP.....','......P......','.............','.............'
      ];
      const flower = [
        '.............','.....YY......','....YPYY.....','...YPPPYY....','...PPPPPY....',
        '.YYYPYPYY....','.YPPGPGPY....','...YGPGYY....','.....G.......','.....G.......',
        '....GGG......','.....G.......','.............'
      ];
      let selected=1, drawing=false, pattern=0;
      function loadPattern(data) {
        for(let i=0;i<size*size;i++) {
          const char=data[Math.floor(i/size)]?.[i%size]||'.';
          const index=char==='P'?1:char==='G'?2:char==='Y'?0:5;
          pixels[i]=index;cells[i].style.setProperty('--px',colors[index]);
        }
      }
      function paint(index) { if(index<0||index>=pixels.length)return;pixels[index]=selected;cells[index].style.setProperty('--px',colors[selected]); }
      for(let i=0;i<size*size;i++) {
        const cell=document.createElement('div'); cell.className='px'; cell.dataset.i=String(i);
        cell.style.setProperty('--px',colors[5]); grid.appendChild(cell);cells.push(cell);
      }
      function onPoint(ev) {
        const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.px');
        if(target && grid.contains(target)) paint(Number(target.dataset.i));
      }
      grid.addEventListener('pointerdown',(ev)=>{if(ev.button!==0 && ev.pointerType==='mouse')return;drawing=true;onPoint(ev);grid.setPointerCapture?.(ev.pointerId)});
      grid.addEventListener('pointermove',(ev)=>{if(drawing)onPoint(ev)});
      window.addEventListener('pointerup',()=>{drawing=false});
      grid.addEventListener('pointercancel',()=>{drawing=false});
      colors.forEach((c,i)=>{
        const btn=document.createElement('button');btn.type='button';btn.className='swatch'+(i===selected?' active':'');
        btn.style.setProperty('--swatch',c);btn.setAttribute('aria-label',`Цвет ${['жёлтый','розовый','зелёный','сиреневый','голубой','кремовый'][i]}`);
        btn.setAttribute('aria-pressed',String(i===selected));
        btn.addEventListener('click',()=>{selected=i;for(const el of palette.children){el.classList.remove('active');el.setAttribute('aria-pressed','false')}btn.classList.add('active');btn.setAttribute('aria-pressed','true')});
        palette.appendChild(btn);
      });
      loadPattern(initialHeart);
      $('resetRug').addEventListener('click',()=>{pattern=(pattern+1)%3;if(pattern===0)loadPattern(initialHeart);else if(pattern===1)loadPattern(flower);else loadPattern(Array.from({length:13},()=>'.'.repeat(13)));toast('Новый холст готов! 🧶')});
      $('saveRug').addEventListener('click',()=>{
        const canvas=document.createElement('canvas');canvas.width=650;canvas.height=650;
        const ctx=canvas.getContext('2d');if(!ctx){toast('Не удалось сохранить рисунок');return}
        ctx.fillStyle='#f4d4aa';ctx.fillRect(0,0,650,650);
        const padding=42,step=(650-2*padding)/size;
        for(let y=0;y<size;y++)for(let x=0;x<size;x++) {
          const n=y*size+x, xx=padding+x*step, yy=padding+y*step;
          ctx.fillStyle=colors[pixels[n]];ctx.fillRect(xx,yy,step+.5,step+.5);
          ctx.strokeStyle='rgba(87,57,47,.14)';ctx.lineWidth=1.5;
          ctx.beginPath();ctx.moveTo(xx+step*.22,yy+step*.3);ctx.lineTo(xx+step*.45,yy+step*.63);ctx.moveTo(xx+step*.72,yy+step*.22);ctx.lineTo(xx+step*.6,yy+step*.49);ctx.stroke();
        }
        const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='moy-pushistyy-kovrik.png';document.body.appendChild(a);a.click();a.remove();toast('Эскиз сохранён! ♥');
      });
    })();
  </script>
</body>
</html>
